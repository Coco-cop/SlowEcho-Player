name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Backend and privacy smoke tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Subtitle parser, sentence looping and script syntax
        run: node tests/player.test.cjs
